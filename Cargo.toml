[package]
name = "debitmetre"
version = "0.1.0"
edition = "2021"
description = "Central transparent proxy gateway for Codex clients with per-machine metering"

[dependencies]
axum = "0.7"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
futures-util = "0.3"
tokio-stream = "0.1"