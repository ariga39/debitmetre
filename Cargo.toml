[package]
name = "debitmetre"
version = "0.1.0"
edition = "2021"
description = "Central transparent proxy gateway for Codex clients with per-machine metering"

[features]
# Test-only seam: lets the binary point the fixed upstream at a fake upstream
# through DEBITMETRE_TEST_UPSTREAM. Never enabled in production builds; the
# production upstream stays fixed in code (SSRF prevention, see DESIGN.md §2).
test-upstream-override = []

[dependencies]
axum = "0.7"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
futures-util = "0.3"
libc = "0.2"
tempfile = "3"
tokio-stream = "0.1"
